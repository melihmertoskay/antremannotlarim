<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Program</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--salon:#285e49;--ev:#985a27;--yuzme:#286987}
    *{box-sizing:border-box}
    body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{text-decoration:none}
    .topbar{border-bottom:1px solid var(--line);background:rgba(244,242,236,.96)}
    .topbar-inner{display:flex;align-items:center;gap:18px;width:min(100% - 24px,760px);min-height:64px;margin:auto}
    .back{padding-right:18px;border-right:1px solid var(--line);color:var(--text);font-size:.8rem;font-weight:800;white-space:nowrap}
    .back:hover{color:var(--accent)}
    .title{font-size:.95rem;font-weight:800}
    main{width:min(100% - 24px,760px);margin:24px auto 56px}
    .lede{margin:0 0 20px;color:var(--muted);font-size:.83rem;line-height:1.5}
    .week{margin-bottom:20px}
    .week:last-child{margin-bottom:0}
    .week-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 7px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
    .week-range{font-weight:650;letter-spacing:.02em;text-transform:none}
    .week-body{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card)}
    .day{border-bottom:1px solid #ebe8e0}
    .day:last-child{border-bottom:0}
    .day>summary{display:grid;grid-template-columns:78px 68px 1fr auto 14px;align-items:center;gap:9px;padding:0 15px;min-height:48px;list-style:none;cursor:pointer}
    .day>summary::-webkit-details-marker{display:none}
    .day>summary:hover{background:#f7f5ef}
    .date{font-size:.78rem;font-weight:800;white-space:nowrap}
    .wd{color:var(--muted);font-size:.76rem;white-space:nowrap}
    .wd-short{display:none}
    .work{overflow:hidden;font-size:.82rem;text-overflow:ellipsis;white-space:nowrap}
    .code{padding:3px 7px;border-radius:6px;font-size:.72rem;font-weight:850;white-space:nowrap}
    .code.salon{background:#e5eee9;color:var(--salon)}
    .code.ev{background:#f4e8dc;color:var(--ev)}
    .code.yuzme{background:#e1eef3;color:var(--yuzme)}
    .sign{color:var(--muted);font-size:.95rem;text-align:center}
    .day[open]>summary{background:#f7f5ef}
    .day[open] .sign{color:var(--text)}
    .day-body{padding:3px 15px 16px;color:#4d514b;font-size:.84rem;line-height:1.6}
    .day-body p{margin:0 0 9px}
    .day-body ul{margin:0 0 9px;padding-left:18px}
    .day-body li{margin:3px 0}
    .day-body>:last-child{margin-bottom:0}
    .kv{color:var(--text);font-weight:800}
    .card-link{display:inline-block;margin-top:3px;color:var(--accent);font-size:.8rem;font-weight:800}
    .card-link:hover{text-decoration:underline}
    .progress{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:var(--muted);font-size:.79rem}
    .alt{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:.82rem}
    .alt .kv{display:block;margin-bottom:2px;color:var(--accent);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase}
    @media(max-width:470px){
      .topbar-inner{min-height:58px}.back{padding-right:13px}.title{font-size:.9rem}
      main{margin-top:18px}
      .day>summary{grid-template-columns:70px 34px 1fr auto 12px;gap:7px;padding:0 12px;min-height:46px}
      .wd-long{display:none}.wd-short{display:inline}
      .date{font-size:.74rem}.wd{font-size:.72rem}.work{font-size:.78rem}
      .day-body{padding:3px 12px 15px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner"><a class="back" href="index.html">← Ana sayfa</a><span class="title">Program</span></div>
  </header>
  <main>
    <p class="lede">17 Ağustos – 12 Eylül. Haftada dört gün: pazartesi ev, çarşamba ve cuma salon (barbell 5×5), cumartesi havuz. Bir güne dokunarak ağırlık önerilerini ve o gün yapılamazsa hangi kartın yerine geçebileceğini görebilirsin. Kullandığın ağırlıkları kartın günlüğüne yaz.</p>
    <div id="weeks"></div>
  </main>
  <script>
    const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
    const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
    const KISA={"Pazar":"Paz","Pazartesi":"Pzt","Salı":"Sal","Çarşamba":"Çar","Perşembe":"Per","Cuma":"Cum","Cumartesi":"Cmt"};

    const kartlar={
      E1:{ad:"İtiş",yer:"ev",
        not:`<p>Evde itiş günü. Ekipman gerekmez, zorluk tempodan ve varyasyondan geliyor.</p>
          <ul>
            <li><span class="kv">Normal şınav:</span> 3×10 sana hafif gelir, <b>3×18</b> yap</li>
            <li><span class="kv">Pike şınavı:</span> 3×8'de kal — omuz için en zorlayıcı hareket, sayıyı zorlama</li>
            <li><span class="kv">Dar tutuş şınav:</span> 3×12</li>
          </ul>`,
        alt:{kod:"S1",metin:"Salona gidebiliyorsan S1'i (dambıl, göğüs-omuz-arka kol) tercih et — aynı kas grubunu daha ağır yükle çalıştırır."}},
      E2:{ad:"Bacak",yer:"ev",
        not:`<p>Evde bacak günü. Ağırlık yok; zorluk tek bacak çalışmasından ve tempodan geliyor.</p>
          <ul>
            <li><span class="kv">Bulgarian split squat:</span> her bacak 3×10; kolaysa arka ayağını daha yükseğe koy</li>
            <li><span class="kv">Yavaş squat:</span> 3 saniyede in, altta 1 saniye bekle</li>
            <li><span class="kv">Tek bacak glute bridge:</span> tepede 2 saniye sık</li>
          </ul>`,
        alt:{kod:"S3",metin:"Salona gidebiliyorsan S3'ü (dambıl bacak) tercih et."}},
      E3:{ad:"Tam Vücut",yer:"ev",
        not:`<p>Evde tam vücut: squat, itiş, çekiş, kalça ve core aynı antrenmanda.</p>
          <ul>
            <li><span class="kv">Normal şınav:</span> 3×15 yap, sana hafif gelir</li>
            <li><span class="kv">Bant ile row:</span> 12. tekrarda zorlanacağın kalınlığı seç</li>
            <li><span class="kv">Yavaş squat:</span> 3 saniyede in, altta 1 saniye bekle</li>
          </ul>`,
        alt:{kod:"S4",metin:"Salona gidebiliyorsan S4'ü (dambıl tam vücut) tercih et."}},
      E4:{ad:"Çekiş",yer:"ev",
        not:`<p>Evde çekiş günü, direnç bandıyla.</p>
          <ul>
            <li><span class="kv">Bant seçimi:</span> 12. tekrarda zorlanacağın kalınlık</li>
            <li><span class="kv">Row hareketleri:</span> direnç azsa bandı kısaltarak sertleştir</li>
            <li><span class="kv">Superman:</span> tepede 1 saniye bekle</li>
          </ul>`,
        alt:{kod:"S2",metin:"Salona gidebiliyorsan S2'yi (dambıl sırt-omuz-kol) tercih et."}},
      S5:{ad:"Barbell 5×5 — A",yer:"salon",
        not:`<p>Squat, bench press, barbell row. Barbell'e ilk defa çıkıyorsan boş bar (20 kg) ile başla, ilk 1-2 antrenman tekniğe odaklan.</p>
          <ul>
            <li><span class="kv">Squat:</span> 20 kg</li>
            <li><span class="kv">Bench press:</span> 20 kg — dambılla 10+10 kg taşıyorsun ama barbell dengesi farklıdır, hafif başlamak doğru</li>
            <li><span class="kv">Barbell row:</span> 20 kg, sırtı düz tutmaya dikkat et</li>
          </ul>
          <p>Squat'ı haftada iki kez (bu kart + S6) çalıştığın için her salon gününde 2,5 kg ekle. Bench ve row'u haftada bir kez çalıştığın için haftalık 2,5 kg ekle. Bir ağırlıkta 3 antrenman üst üste 5 setin 5 tekrarını tamamlayamazsan, %10 düşüp oradan devam et.</p>`,
        alt:{kod:"E3",metin:"Salona gidemiyorsan E3 (Evde Tam Vücut) en yakın alternatiftir — squat, itiş ve çekiş üçü de var. Barbell'in ağırlığını karşılamaz, ama hareket kalıbı aynı."}},
      S6:{ad:"Barbell 5×5 — B",yer:"salon",
        not:`<p>Squat, overhead press, deadlift.</p>
          <ul>
            <li><span class="kv">Squat:</span> S5'te bıraktığın ağırlıktan devam</li>
            <li><span class="kv">Overhead press:</span> 15-20 kg — en zayıf kaldıracağın hareket, omuzun yorgunsa 15 kg'da kal</li>
            <li><span class="kv">Deadlift:</span> 40 kg, tek set (1×5) — dambılla Romanian deadlift'te 10+10 kg çalıştığın için bu seviye makul bir başlangıç</li>
          </ul>
          <p>Deadlift'i haftada sadece bir kez çalıştığın ve toparlanması hızlı olduğu için haftalık 5 kg ekle. OHP'yi haftalık 2,5 kg ekle. Aynı 3-antrenman kuralı burada da geçerli.</p>`,
        alt:{kod:"E4",metin:"Salona gidemiyorsan tam bir eşdeğeri yok. E4 (Bantla Sırt ve Çekiş) deadlift'in sırt/posterior zincir rolünü kısmen karşılar; squat ve overhead press'in karşılığı kalmaz. Bu günü atlamak yerine E2 (bacak) ile E4'ü aynı gün art arda yapmayı düşünebilirsin."}},
      Y1:{ad:"Yüzme",yer:"yuzme",
        not:`<p>Teknik ve rahat yüzme, toplam 500 m. 400 m kesintisiz yüzebildiğin için rahat gelmeli — hızı değil kulaç uzunluğunu düşün.</p>`,
        alt:{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}},
      Y2:{ad:"Yüzme",yer:"yuzme",
        not:`<p>Kısa aralıklı yüzme, toplam 450 m. Haftanın en tempolu günü.</p>
          <p>8×25 m bölümü en zor kısmı; nefesin bir sonraki tekrara kadar toparlanmıyorsa arayı 30 saniyeden 45 saniyeye çıkar.</p>`,
        alt:{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}},
      Y3:{ad:"Yüzme",yer:"yuzme",
        not:`<p>Kesintisiz yüzme, toplam 550 m. İçindeki 300 m kesintisiz bölüm 400 m'lik kapasitenin altında, istikrarlı tempoda geçmeli.</p>`,
        alt:{kod:null,metin:"Havuz kapalıysa, o hafta kullanılmayan bir ev kartını hafif tempoda yap. Kardiyoyu tam karşılamaz ama haftayı boş bırakmamış olursun."}}
    };

    // Pazartesi ev · Çarşamba ve Cuma salon (barbell, sabit A/B) · Cumartesi havuz.
    const plan=[
      {ev:"E3",yuzme:"Y1"},
      {ev:"E1",yuzme:"Y2"},
      {ev:"E2",yuzme:"Y3"},
      {ev:"E4",yuzme:"Y1"}
    ];
    const OFSET={ev:0,salonA:2,salonB:4,yuzme:5};
    const ILERLEME="3–4. hafta: 1–2. haftada günlüğe yazdığın ağırlığın son setinde 2 fazla tekrar yapabildiysen 2–2,5 kg artır.";

    const basla=new Date(2026,7,17);
    const kutu=document.getElementById("weeks");

    plan.forEach((hafta,hi)=>{
      const gunler=[
        {tur:"ev",kod:hafta.ev},
        {tur:"salonA",kod:"S5"},
        {tur:"salonB",kod:"S6"},
        {tur:"yuzme",kod:hafta.yuzme}
      ].map(g=>{
        const t=new Date(basla);
        t.setDate(basla.getDate()+hi*7+OFSET[g.tur]);
        return {...g,tarih:t};
      });

      const ilk=gunler[0].tarih,son=gunler[gunler.length-1].tarih;
      const aralik=ilk.getMonth()===son.getMonth()
        ? `${ilk.getDate()}–${son.getDate()} ${AYLAR[son.getMonth()]}`
        : `${ilk.getDate()} ${AYLAR[ilk.getMonth()]} – ${son.getDate()} ${AYLAR[son.getMonth()]}`;

      const satirlar=gunler.map(({tur,kod,tarih})=>{
        const k=kartlar[kod];
        const yer=kod.startsWith("S")?"salon":(kod.startsWith("E")?"ev":"yuzme");
        const adi=GUNLER[tarih.getDay()];
        const ek=(tur==="ev"||tur==="yuzme")&&hi>=2?`<p class="progress">${ILERLEME}</p>`:"";
        const altHtml=k.alt.kod
          ? `<a class="card-link" href="kart.html#${k.alt.kod}">${k.alt.kod}</a> — ${k.alt.metin}`
          : k.alt.metin;
        return `<details class="day">
          <summary>
            <span class="date">${tarih.getDate()} ${AYLAR[tarih.getMonth()]}</span>
            <span class="wd"><span class="wd-long">${adi}</span><span class="wd-short">${KISA[adi]}</span></span>
            <span class="work">${k.ad}</span>
            <span class="code ${yer}">${kod}</span>
            <span class="sign">+</span>
          </summary>
          <div class="day-body">${k.not}<a class="card-link" href="kart.html#${kod}">${kod} kartını aç →</a>${ek}
            <div class="alt"><span class="kv">Alternatif</span>${altHtml}</div>
          </div>
        </details>`;
      }).join("");

      kutu.insertAdjacentHTML("beforeend",
        `<section class="week">
          <div class="week-head"><span>${hi+1}. Hafta</span><span class="week-range">${aralik}</span></div>
          <div class="week-body">${satirlar}</div>
        </section>`);
    });

    kutu.addEventListener("toggle",e=>{
      const d=e.target;
      if(d.tagName!=="DETAILS")return;
      d.querySelector(".sign").textContent=d.open?"−":"+";
    },true);
  </script>
</body>
</html>
