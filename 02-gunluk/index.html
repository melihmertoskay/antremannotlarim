<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f2ec"><title>Günlük</title>
<style>:root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--soft:#e5eee9}*{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96)}.nav{display:flex;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;align-items:center;overflow:auto}.nav a{flex:none;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}.nav a:hover{background:#ebe8e0;color:var(--text)}.nav .active{background:var(--soft);color:var(--accent)}main{width:min(100% - 24px,760px);margin:24px auto 60px}.actions{display:flex;justify-content:flex-end;margin-bottom:14px}.primary{border:0;border-radius:9px;background:var(--accent);color:white;padding:10px 14px;font-weight:750;cursor:pointer}.empty{padding:28px 10px;color:var(--muted);text-align:center}.day{border-top:1px solid var(--line)}.day:last-child{border-bottom:1px solid var(--line)}.day>summary{display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;min-height:58px;padding:10px 4px;list-style:none;cursor:pointer}.day>summary::-webkit-details-marker{display:none}.day-title{font-weight:760}.day-meta{color:var(--muted);font-size:.78rem}.sign{color:var(--accent);font-size:1.1rem}.records{padding:0 4px 16px}.record{padding:13px 0;border-top:1px solid #e8e4db}.record-head{display:flex;justify-content:space-between;gap:12px}.record-name{font-weight:720}.record-code{color:var(--accent);font-size:.78rem;font-weight:800}.record-data,.record-note{margin:5px 0 0;color:#555a53;font-size:.84rem;line-height:1.5}.record-actions{display:flex;gap:12px;margin-top:9px}.text-button{padding:0;border:0;background:none;color:var(--accent);font-size:.78rem;cursor:pointer}.danger{color:#9b3e34}.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(24,27,23,.55)}.modal.open{display:flex}.dialog{width:min(100%,520px);max-height:92vh;overflow:auto;border-radius:18px;background:var(--card);box-shadow:0 24px 80px #0004}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:1.15rem}.close{display:grid;width:36px;height:36px;place-items:center;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}.form{display:grid;gap:14px;padding:20px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:750}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--text)}.field textarea{min-height:92px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.secondary{padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}@media(max-width:480px){main{margin-top:17px}.day>summary{grid-template-columns:1fr 18px}.day-meta{display:none}}</style></head>
<body><header class="topbar"><nav class="nav"><a href="../index.html">Ana Sayfa</a><a href="../01-program/">Program</a><a class="active" href="../02-gunluk/">Günlük</a><a href="../03-antrenmanlar/">Antrenmanlar</a><a href="../04-egzersizler/">Egzersizler</a></nav></header>
<main><div class="actions"><button class="primary" id="add">+ Kayıt ekle</button></div><div id="days"></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">Kayıt ekle</h2><button class="close" type="button" id="close" aria-label="Kapat">×</button></div><form class="form" id="form"><input type="hidden" id="recordId"><div class="field"><label for="date">Gün</label><input id="date" type="date" required></div><div class="field"><label for="antrenman">Antrenman kartı</label><select id="antrenman" required></select></div><div class="field"><label for="exercise">Egzersiz</label><select id="exercise" required></select></div><div class="field"><label for="weight">Ağırlık</label><input id="weight" placeholder="Örn. 10 kg veya vücut ağırlığı"></div><div class="field"><label for="sets">Set ve tekrar</label><input id="sets" placeholder="Örn. 3 × 10"></div><div class="field"><label for="note">Not</label><textarea id="note" placeholder="Antrenmanla ilgili notun"></textarea></div><div class="form-actions"><button class="secondary" type="button" id="cancel">Vazgeç</button><button class="primary" type="submit">Kaydet</button></div></form></div></div>
<script src="gunlukverileri.js"></script><script src="../04-egzersizler/egzersizverileri.js"></script><script src="../04-egzersizler/kodlar.js"></script>
<script>
const $=id=>document.getElementById(id),days=$("days"),modal=$("modal"),form=$("form");

function doldur(){
 $("antrenman").innerHTML=Object.entries(ANTRENMAN_ADI).map(([k,a])=>`<option value="${k}">${k} - ${a}</option>`).join("");
 $("exercise").innerHTML=Object.keys(EGZERSIZLER).sort((a,b)=>(EGZERSIZ_KODLARI[a]||"Z").localeCompare(EGZERSIZ_KODLARI[b]||"Z",undefined,{numeric:true})).map(a=>`<option value="${gunlukKacis(a)}">${EGZERSIZ_KODLARI[a]||"–"} - ${gunlukKacis(a)}</option>`).join("");
}
function render(){const liste=gunlukKayitlariniGetir().sort((a,b)=>b.gun.localeCompare(a.gun));const gruplar=Object.groupBy?Object.groupBy(liste,x=>x.gun):liste.reduce((o,x)=>((o[x.gun]||=[]).push(x),o),{});const gunler=Object.keys(gruplar).sort().reverse();if(!gunler.length){days.innerHTML='<p class="empty">Henüz günlük kaydı yok.</p>';return}days.innerHTML=gunler.map(gun=>{const kayitlar=gruplar[gun];const antrenmanlar=[...new Set(kayitlar.map(x=>x.antrenman))].join(", ");return `<details class="day"><summary><span class="day-title">${gunlukTarihEtiketi(gun)}</span><span class="day-meta">${antrenmanlar} · ${kayitlar.length} kayıt</span><span class="sign">+</span></summary><div class="records">${kayitlar.map(k=>`<article class="record"><div class="record-head"><span class="record-name">${gunlukKacis(k.egzersiz)}</span><span class="record-code">${gunlukKacis(k.antrenman)}</span></div><p class="record-data">${[k.agirlik,k.setTekrar].filter(Boolean).map(gunlukKacis).join(" · ")||"Ağırlık veya tekrar bilgisi yok"}</p>${k.aciklama?`<p class="record-note">${gunlukKacis(k.aciklama)}</p>`:""}<div class="record-actions"><button class="text-button edit" data-id="${k.id}">Düzenle</button><button class="text-button danger delete" data-id="${k.id}">Sil</button></div></article>`).join("")}</div></details>`}).join("")}
let gunlukPenceresiAcik=false;
function gunlukFormAc(record){$("modalTitle").textContent=record?"Kaydı düzenle":"Kayıt ekle";$("recordId").value=record?.id||"";$("date").value=record?.gun||new Date().toISOString().slice(0,10);$("antrenman").value=record?.antrenman||"S1";$("exercise").value=record?.egzersiz||Object.keys(EGZERSIZLER)[0];$("weight").value=record?.agirlik||"";$("sets").value=record?.setTekrar||"";$("note").value=record?.aciklama||"";if(!modal.classList.contains("open")){history.pushState({gunlukPenceresi:true},"",location.href);gunlukPenceresiAcik=true}modal.classList.add("open");$("date").focus()}
function gercektenKapat(){modal.classList.remove("open");gunlukPenceresiAcik=false}
function gunlukFormKapat(){if(history.state&&history.state.gunlukPenceresi)history.back();else gercektenKapat()}
addEventListener("popstate",()=>{if(gunlukPenceresiAcik&&!(history.state&&history.state.gunlukPenceresi))gercektenKapat()});
$("add").onclick=()=>gunlukFormAc();$("close").onclick=gunlukFormKapat;$("cancel").onclick=gunlukFormKapat;modal.onclick=e=>{if(e.target===modal)gunlukFormKapat()};document.onkeydown=e=>{if(e.key==="Escape")gunlukFormKapat()};
form.onsubmit=e=>{e.preventDefault();const veri={gun:$("date").value,antrenman:$("antrenman").value,egzersiz:$("exercise").value,agirlik:$("weight").value.trim(),setTekrar:$("sets").value.trim(),aciklama:$("note").value.trim()};const id=$("recordId").value;if(id)gunlukKaydiGuncelle(id,veri);else gunlukKaydiEkle(veri);gunlukFormKapat();render()};
days.onclick=e=>{const duzenle=e.target.closest(".edit"),sil=e.target.closest(".delete");if(duzenle)gunlukFormAc(gunlukKayitlariniGetir().find(x=>x.id===duzenle.dataset.id));if(sil&&confirm("Bu günlük kaydı silinsin mi?")){gunlukKaydiSil(sil.dataset.id);render()}};days.addEventListener("toggle",e=>{if(e.target.matches("details.day"))e.target.querySelector(".sign").textContent=e.target.open?"−":"+"},true);doldur();render();
</script></body></html>
