<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Antrenman Kartları</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--soft:#e5eee9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button{font:inherit}.menu{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96);backdrop-filter:blur(12px)}
    .menu-inner{display:flex;align-items:center;gap:18px;width:min(100% - 24px,860px);min-height:66px;margin:auto;overflow-x:auto;scrollbar-width:none}.menu-inner::-webkit-scrollbar{display:none}
    .home-link{flex:0 0 auto;padding-right:16px;border-right:1px solid var(--line);color:var(--text);font-size:.78rem;font-weight:800;text-decoration:none;white-space:nowrap}
    .home-link:hover{color:var(--accent)}
    main{width:min(100% - 24px,760px);margin:34px auto 60px}.card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 14px 42px rgba(45,48,41,.07)}
    .card-header{display:flex;align-items:center;gap:15px;padding:22px 24px;border-bottom:1px solid var(--line)}.card-code{display:grid;flex:0 0 54px;width:54px;height:54px;place-items:center;border-radius:13px;background:var(--soft);color:var(--accent);font-size:1.1rem;font-weight:850}
    h1{margin:0 0 4px;font-size:clamp(1.28rem,4vw,1.7rem);line-height:1.15}.card-meta{margin:0;color:var(--muted);font-size:.84rem}.table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;table-layout:fixed}th{padding:11px 12px;background:#f6f4ee;color:var(--muted);font-size:.69rem;letter-spacing:.06em;text-align:left;text-transform:uppercase}
    td{padding:17px 12px;border-top:1px solid #ebe8e0;vertical-align:middle;font-size:.94rem}tbody tr:first-child td{border-top:0}
    th:nth-child(1),td:nth-child(1){width:48px;color:var(--muted);text-align:center}th:nth-child(2),td:nth-child(2){width:92px}th:nth-child(4),td:nth-child(4){width:105px}
    .time{color:var(--accent);font-size:.84rem;font-weight:800;white-space:nowrap}.exercise{font-weight:650}.target{font-weight:800;white-space:nowrap}
    .card-extras{border-top:1px solid var(--line);padding:4px 20px 12px}.card-extras details{border-bottom:1px solid #ebe8e0}.card-extras details:last-child{border-bottom:0}
    .card-extras summary{padding:13px 2px;color:var(--accent);font-size:.86rem;font-weight:400;list-style:none;cursor:pointer}.card-extras summary::-webkit-details-marker{display:none}.card-extras summary::before{content:"+ ";}.card-extras details[open] summary::before{content:"− "}
    .extra-content{padding:1px 2px 17px;color:#4d514b;font-size:.88rem;line-height:1.6}.extra-content p{margin:0 0 10px}.extra-content p:last-child{margin-bottom:0}.empty{color:var(--muted)}
    .journal-list{display:grid}
    .journal-entry{border-bottom:1px solid #ebe8e0}.journal-entry:last-child{border-bottom:0}
    .journal-entry summary{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;color:var(--text);font-weight:400;list-style:none;cursor:pointer}
    .journal-entry summary::-webkit-details-marker{display:none}
    .journal-entry summary::after{content:"+";color:var(--accent);font-size:1.1rem;font-weight:500}
    .journal-entry[open] summary::after{content:"−"}
    .entry-body{padding:0 2px 15px}.entry-body ul{margin:0 0 10px;padding-left:19px}.entry-body li{margin:2px 0}.entry-body p{margin:0}
    .about-label{display:block;margin-bottom:2px;color:var(--text);font-weight:800}
    .exercise-button{padding:0;border:0;border-bottom:1px dashed currentColor;background:none;color:inherit;font:inherit;font-weight:650;text-align:left;cursor:pointer}
    .exercise-button:hover{color:var(--accent)}
    .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(24,27,23,.55)}
    .modal.open{display:flex}.modal-box{width:min(100%,520px);max-height:min(82vh,680px);overflow:auto;border-radius:18px;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.22)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .modal-header h2{margin:0;font-size:1.2rem}.modal-close{display:grid;width:36px;height:36px;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--text);font-size:1.25rem;cursor:pointer}
    .modal-body{padding:20px}.exercise-image{display:block;width:100%;height:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:12px;background:#faf8f1}.modal-section{margin-bottom:18px}.modal-section:last-child{margin-bottom:0}.modal-section h3{margin:0 0 5px;color:var(--accent);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}.modal-section p{margin:0;line-height:1.6}.coming-soon{margin:0;color:var(--muted)}
    @media(max-width:560px){.menu-inner{min-height:59px;gap:13px}.home-link{padding-right:12px}main{margin-top:20px}.card-header{padding:18px}th{padding:9px 7px;font-size:.62rem}td{padding:15px 7px;font-size:.86rem}th:nth-child(1),td:nth-child(1){width:34px}th:nth-child(2),td:nth-child(2){width:74px}th:nth-child(4),td:nth-child(4){width:79px}.time{font-size:.76rem}.target{white-space:normal}}
  </style>
</head>

    <div class="card-extras">
      <details id="journalDetails"><summary>Kart günlüğü</summary><div class="extra-content" id="journalContent"></div></details>
      <details id="aboutDetails"><summary>Kart hakkında</summary><div class="extra-content" id="aboutContent"></div></details>
    </div>
  </article></main>
  <div class="modal" id="exerciseModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <header class="modal-header"><h2 id="modalTitle"></h2><button class="modal-close" id="modalClose" aria-label="Kapat">×</button></header>

    const cardInfo={

        journal:[

    const rows=document.getElementById("workoutRows"),journalContent=document.getElementById("journalContent"),aboutContent=document.getElementById("aboutContent"),journalDetails=document.getElementById("journalDetails"),aboutDetails=document.getElementById("aboutDetails");
    function showCard(code){
      const w=workouts[code];
      document.documentElement.style.setProperty("--accent",w.color[0]);document.documentElement.style.setProperty("--soft",w.color[1]);
      document.getElementById("cardCode").textContent=code;document.getElementById("cardTitle").textContent=w.title;document.getElementById("cardMeta").textContent=w.meta;document.title=code+" · "+w.title;
      rows.innerHTML=w.rows.map((r,i)=>`<tr><td>${i+1}</td><td class="time">${r[0]}</td><td class="exercise"><button class="exercise-button" data-exercise="${r[1]}">${r[1]}</button></td><td class="target">${r[2]}</td></tr>`).join("");
      const info=cardInfo[code];
      journalContent.innerHTML=info.journal&&info.journal.length
        ? `<div class="journal-list">${info.journal.map(e=>`<details class="journal-entry"><summary>${e.date}</summary><div class="entry-body">${e.html}</div></details>`).join("")}</div>`
        : '<p class="empty">Bu kart için henüz günlük kaydı yok.</p>';
      aboutContent.innerHTML=`<p><span class="about-label">Amaç</span>${info.aim}</p><p><span class="about-label">Ne zaman seçilmeli?</span>${info.when}</p>`;journalDetails.open=false;aboutDetails.open=false;
    }
    const modal=document.getElementById("exerciseModal"),modalTitle=document.getElementById("modalTitle"),modalBody=document.getElementById("modalBody"),modalClose=document.getElementById("modalClose");
    function openExercise(name){
      const detail=exerciseDetails[name];modalTitle.textContent=name;
      modalBody.innerHTML=detail
        ? `<img class="exercise-image" src="${benchPressImage}" alt="Dambıl bench press hareketi; göğüs ana, ön omuz ve arka kol yardımcı kaslar olarak renklendirilmiş"><section class="modal-section"><h3>Nasıl yapılır?</h3><p>${detail.application}</p></section><section class="modal-section"><h3>Dikkat</h3><p>${detail.attention}</p></section><section class="modal-section"><h3>Çalışan kaslar</h3><p>${detail.muscles}</p></section><section class="modal-section"><h3>Daha kolay</h3><p>${detail.easier}</p></section>`
        : '<p class="coming-soon">Bu hareketin açıklaması hazırlanacak.</p>';
      modal.classList.add("open");modalClose.focus();
    }
    function closeModal(){modal.classList.remove("open")}
    document.addEventListener("click",e=>{const button=e.target.closest(".exercise-button");if(button)openExercise(button.dataset.exercise)});
    modalClose.addEventListener("click",closeModal);modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    const requestedCode=location.hash.slice(1).toUpperCase();
    showCard(workouts[requestedCode]?requestedCode:"S1");
  </script>
