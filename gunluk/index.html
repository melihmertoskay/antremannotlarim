<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Günlük</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--salon:#285e49;--ev:#985a27;--yuzme:#286987}
    *{box-sizing:border-box}
    body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{text-decoration:none}
    .topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96);backdrop-filter:blur(12px)}
    .topbar-inner{display:flex;align-items:center;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;overflow-x:auto;scrollbar-width:none}
    .topbar-inner::-webkit-scrollbar{display:none}
    .nav-link{flex:0 0 auto;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}
    .nav-link:hover{color:var(--text);background:#ebe8e0}
    .nav-link.active{color:var(--accent);background:#e5eee9}
    main{width:min(100% - 24px,760px);margin:24px auto 56px}
    .lede{margin:0 0 20px;color:var(--muted);font-size:.83rem;line-height:1.5}
    .empty{padding:28px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-size:.85rem;text-align:center}
    .week{margin-bottom:20px}
    .week:last-child{margin-bottom:0}
    .week-head{padding:0 4px 7px;color:var(--muted);font-size:.72rem;font-weight:650;letter-spacing:.02em}
    .week-body{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--card)}
    .day{border-bottom:1px solid #ebe8e0}
    .day:last-child{border-bottom:0}
    .day>summary{display:grid;grid-template-columns:78px 68px 1fr auto 14px;align-items:center;gap:9px;padding:0 15px;min-height:48px;list-style:none;cursor:pointer}
    .day>summary::-webkit-details-marker{display:none}
    .day>summary:hover{background:#f7f5ef}
    .date{font-size:.78rem;font-weight:800;white-space:nowrap}
    .wd{color:var(--muted);font-size:.76rem;white-space:nowrap}
    .wd-short{display:none}
    .work{overflow:hidden;font-size:.82rem;text-overflow:ellipsis;white-space:nowrap}
    .code{padding:3px 7px;border-radius:6px;font-size:.72rem;font-weight:850;white-space:nowrap}
    .code.salon{background:#e5eee9;color:var(--salon)}
    .code.ev{background:#f4e8dc;color:var(--ev)}
    .code.yuzme{background:#e1eef3;color:var(--yuzme)}
    .sign{color:var(--muted);font-size:.95rem;text-align:center}
    .day[open]>summary{background:#f7f5ef}
    .day[open] .sign{color:var(--text)}
    .day-body{padding:3px 15px 16px;color:#4d514b;font-size:.84rem;line-height:1.6}
    .day-body ul{margin:0 0 10px;padding-left:18px}
    .day-body li{margin:3px 0}
    .day-body p{margin:0 0 9px}
    .day-body>:last-child{margin-bottom:0}
    .card-link{display:inline-block;margin-top:3px;color:var(--accent);font-size:.8rem;font-weight:800}
    .card-link:hover{text-decoration:underline}
    @media(max-width:470px){
      main{margin-top:18px}
      .day>summary{grid-template-columns:70px 34px 1fr auto 12px;gap:7px;padding:0 12px;min-height:46px}
      .wd-long{display:none}.wd-short{display:inline}
      .date{font-size:.74rem}.wd{font-size:.72rem}.work{font-size:.78rem}
      .day-body{padding:3px 12px 15px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="topbar-inner">
      <a class="nav-link" href="../index.html">Ana Sayfa</a>
      <a class="nav-link" href="../program/">Program</a>
      <a class="nav-link active" href="../gunluk/">Günlük</a>
      <a class="nav-link" href="../kartlar/">Kartlar</a>
      <a class="nav-link" href="../egzersizler/">Egzersizler</a>
    </nav>
  </header>
  <main>
    <p class="lede">Program hangi antrenmanın planlandığını gösterir, burası hangisinin gerçekten yapıldığını gösterir. Bir kartın günlüğüne kayıt eklendiğinde burada da otomatik görünür.</p>
    <div id="weeks"></div>
  </main>
  <script src="gunlukverileri.js"></script>
  <script>
    const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
    const AY_INDEX={};AYLAR.forEach((a,i)=>AY_INDEX[a]=i);
    const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
    const KISA={"Pazar":"Paz","Pazartesi":"Pzt","Salı":"Sal","Çarşamba":"Çar","Perşembe":"Per","Cuma":"Cum","Cumartesi":"Cmt"};

    function tarihiCoz(t){
      if(/^\d{4}-\d{2}-\d{2}$/.test(t)){
        const [yil,ay,gun]=t.split("-").map(Number);
        return new Date(yil,ay-1,gun);
      }
      const [gun,ay,yil]=t.split(" ");
      return new Date(Number(yil),AY_INDEX[ay],Number(gun));
    }
    function gunlukIcerigi(k){
      const liste=(k.egzersizler||[]).length
        ? `<ul>${k.egzersizler.map(e=>`<li>${e.ad}: ${e.agirlik}${e.setTekrar?`, ${e.setTekrar}`:""}</li>`).join("")}</ul>`
        : "";
      const not=k.aciklama?`<p>${k.aciklama}</p>`:"";
      return liste+not;
    }
    function pazartesiBasi(d){
      const fark=(d.getDay()+6)%7;
      const m=new Date(d);m.setDate(d.getDate()-fark);
      return m;
    }
    function yerTuru(kod){
      return kod[0]==="S"?"salon":(kod[0]==="E"?"ev":"yuzme");
    }

    const kutu=document.getElementById("weeks");
    const kayitlar=(typeof GUNLUK!=="undefined"?GUNLUK:[])
      .map(g=>({...g,_tarih:tarihiCoz(g.gun||g.tarih)}))
      .sort((a,b)=>b._tarih-a._tarih);

    if(!kayitlar.length){
      kutu.innerHTML='<p class="empty">Henüz bir kayıt yok. Bir kartın günlüğüne eklediğin ilk kayıt burada görünecek.</p>';
    } else {
      const haftalar=[];
      let mevcut=null;
      kayitlar.forEach(k=>{
        const pzt=pazartesiBasi(k._tarih).getTime();
        if(!mevcut||mevcut.pzt!==pzt){
          mevcut={pzt,girdiler:[]};
          haftalar.push(mevcut);
        }
        mevcut.girdiler.push(k);
      });

      haftalar.forEach(hafta=>{
        const ilk=new Date(hafta.pzt),son=new Date(hafta.pzt);son.setDate(son.getDate()+6);
        const aralik=ilk.getMonth()===son.getMonth()
          ? `${ilk.getDate()}–${son.getDate()} ${AYLAR[son.getMonth()]}`
          : `${ilk.getDate()} ${AYLAR[ilk.getMonth()]} – ${son.getDate()} ${AYLAR[son.getMonth()]}`;

        const satirlar=hafta.girdiler.map(k=>{
          const adi=GUNLER[k._tarih.getDay()];
          return `<details class="day">
            <summary>
              <span class="date">${k._tarih.getDate()} ${AYLAR[k._tarih.getMonth()]}</span>
              <span class="wd"><span class="wd-long">${adi}</span><span class="wd-short">${KISA[adi]}</span></span>
              <span class="work">${KART_ADI[k.kart]||k.kart}</span>
              <span class="code ${yerTuru(k.kart)}">${k.kart}</span>
              <span class="sign">+</span>
            </summary>
            <div class="day-body">${gunlukIcerigi(k)}<a class="card-link" href="../kartlar/kart.html#${k.kart}">${k.kart} kartını aç →</a></div>
          </details>`;
        }).join("");

        kutu.insertAdjacentHTML("beforeend",
          `<section class="week">
            <div class="week-head">${aralik}</div>
            <div class="week-body">${satirlar}</div>
          </section>`);
      });
    }

    kutu.addEventListener("toggle",e=>{
      const d=e.target;
      if(d.tagName!=="DETAILS")return;
      d.querySelector(".sign").textContent=d.open?"−":"+";
    },true);
  </script>
</body>
</html>
