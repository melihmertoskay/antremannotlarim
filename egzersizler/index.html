<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Egzersizler</title>
  <style>
    :root{--bg:#f4f2ec;--card:#fffefa;--text:#22241f;--muted:#73766f;--line:#ddd9cf;--accent:#285e49;--soft:#e5eee9}
    *{box-sizing:border-box}body{min-width:320px;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(244,242,236,.96);backdrop-filter:blur(12px)}
    .topbar-inner{display:flex;align-items:center;gap:4px;width:min(100% - 24px,760px);min-height:56px;margin:auto;overflow-x:auto;scrollbar-width:none}.topbar-inner::-webkit-scrollbar{display:none}
    .nav-link{flex:0 0 auto;padding:8px 12px;border-radius:8px;color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}.nav-link:hover{color:var(--text);background:#ebe8e0}.nav-link.active{color:var(--accent);background:var(--soft)}
    main{width:min(100% - 24px,760px);margin:24px auto 56px}.list{border-top:1px solid var(--line)}
    .exercise{border-bottom:1px solid var(--line)}.exercise summary{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:58px;padding:10px 4px;font-size:.92rem;cursor:pointer;list-style:none}.exercise summary::-webkit-details-marker{display:none}.exercise summary::after{content:"+";color:var(--accent);font-size:1.15rem}.exercise[open] summary::after{content:"−"}
    .body{padding:0 4px 18px;color:#4d514b;font-size:.87rem;line-height:1.6}.body p{margin:0 0 9px}.body p:last-child{margin-bottom:0}.label{color:var(--text);font-weight:750}.image{display:block;width:min(100%,520px);height:auto;margin:2px 0 16px;border:1px solid var(--line);border-radius:12px}
    .last{margin-top:14px;padding-top:11px;border-top:1px solid #ebe8e0;color:var(--muted);font-size:.8rem}
    @media(max-width:520px){main{margin-top:18px}.exercise summary{font-size:.88rem}}
  </style>
</head>
<body>
  <header class="topbar"><nav class="topbar-inner">
      <a class="nav-link" href="../index.html">Ana Sayfa</a>
      <a class="nav-link" href="../program/">Program</a>
      <a class="nav-link" href="../gunluk/">Günlük</a>
      <a class="nav-link" href="../kartlar/">Kartlar</a>
      <a class="nav-link active" href="../egzersizler/">Egzersizler</a>
    </nav></header>
  <main><div class="list" id="exerciseList"></div></main>
  <script src="egzersizverileri.js"></script>
  <script src="../gunluk/gunlukverileri.js"></script>
  <script>
    const list=document.getElementById("exerciseList");
    const records=(typeof GUNLUK!=="undefined"?GUNLUK:[]).slice().sort((a,b)=>(b.gun||b.tarih).localeCompare(a.gun||a.tarih));
    function lastRecord(name){
      for(const record of records){
        const item=(record.egzersizler||[]).find(e=>e.ad===name);
        if(item)return `Son antrenman: ${record.tarih} | ${item.agirlik}`;
      }
      return "Henüz kayıt yok";
    }
    Object.entries(EGZERSIZLER)
      .sort((a,b)=>a[0].localeCompare(b[0],"tr"))
      .forEach(([name,info])=>{
        const image=EGZERSIZ_GORSELLERI[name];
        list.insertAdjacentHTML("beforeend",`<details class="exercise">
          <summary>${name}</summary>
          <div class="body">
            ${image?`<img class="image" src="${image}" alt="${name} hareketini ve çalışan kasları gösteren görsel">`:""}
            <p><span class="label">Nasıl yapılır:</span> ${info.application}</p>
            <p><span class="label">Çalışan kaslar:</span> ${info.muscles}</p>
            <p><span class="label">Dikkat:</span> ${info.attention}</p>
            <p class="last">${lastRecord(name)}</p>
          </div>
        </details>`);
      });
  </script>
</body>
</html>
